# Each test runs `runner.py -f <file> -t <duration> -u <users> --name <name>`
# with --tag set to the build commit hash and --dest set from the orchestrator's
# --dest flag. The orchestrator deploys + tears down substrate + workloads
# around each test so runs don't pollute each other.
#
# Optional `flags` is a list of arbitrary strings appended to runner.py's
# argv; runner.py forwards them to locust verbatim.
#
# Optional `workerCount` (default 1) sets the WorkerPool replica count for
# the deploy that runs before this test. The orchestrator redeploys
# workloads between tests, so each test can pick its own scale.
#
# Optional `sandboxClass` (default "gvisor") picks the sandbox runtime for
# the benchmark WorkerPool. Allowed values: "gvisor" | "microvm".
#
# Required `targetCluster` names a config file under
# /etc/orchestrator/target-clusters/ (e.g. `targetCluster: dev` ->
# /etc/orchestrator/target-clusters/dev.sh). The orchestrator copies that
# file into the cloned repo as .ate-dev-env.sh before the test runs and
# deletes it after, so different tests can target different clusters /
# projects from one CronJob run.

tests:
  - name: glutton_baseline_1_user
    description: "Glutton baseline: 1 concurrent user for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_baseline_5_users
    description: "Glutton baseline: 5 concurrent users for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 5
    workerCount: 5
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_baseline_10_users
    description: "Glutton baseline: 10 concurrent users for 1 minute (doubles the number of workers/node)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 10
    workerCount: 10
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_oversubscribe_15_users
    description: "Glutton baseline: 15 concurrent users for 2 minutes (50% oversubscribed)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 2m
    users: 15
    workerCount: 10
    flags:
      - "--min-wait-time"
      - "0.5"
      - "--max-wait-time"
      - "1.0"

  # microVM runs. Each mirrors a gvisor test above with the same users /
  # workerCount / wait times, so the pair is directly comparable and the only
  # variable is the sandbox runtime. Read the per-sandbox memory cost with
  # `kubectl ate top workers` while a run is in flight.
  - name: glutton_microvm_baseline_1_user
    description: "Glutton on microVM: 1 concurrent user for 1 minute (pairs with glutton_baseline_1_user)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    sandboxClass: microvm
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_microvm_baseline_5_users
    description: "Glutton on microVM: 5 concurrent users for 1 minute (pairs with glutton_baseline_5_users)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 5
    workerCount: 5
    sandboxClass: microvm
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"

  # Memory-pressure pair. --glutton-ram-bytes makes each actor hold 256MiB
  # resident, rewritten every iteration, so the suspend snapshot carries it
  # too. Run both to get the gvisor-vs-microVM delta under a known guest
  # working set rather than at idle.
  - name: glutton_mem_256mib_5_users
    description: "Glutton on gvisor: 5 users holding 256MiB each for 2 minutes"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 2m
    users: 5
    workerCount: 5
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
      - "--glutton-ram-bytes"
      - "268435456"
  - name: glutton_microvm_mem_256mib_5_users
    description: "Glutton on microVM: 5 users holding 256MiB each for 2 minutes (pairs with glutton_mem_256mib_5_users)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 2m
    users: 5
    workerCount: 5
    sandboxClass: microvm
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
      - "--glutton-ram-bytes"
      - "268435456"
